# Render deployment configuration for music-autoplay.
# Deploy with: render services create -f render.yaml (or push to the repo with auto-deploy enabled).
#
# Secrets marked `sync: false` must be filled in via the Render dashboard or CLI - never commit values here.

services:
  - type: web
    name: music-autoplay
    runtime: docker
    env: docker
    region: oregon
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: YOUTUBE_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # The free plan has no persistent disk, so every store lives in MongoDB.
      - key: PERSISTENCE_PROVIDER
        value: mongo
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        value: https://music-auto-play.onrender.com
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        value: https://music-auto-play.onrender.com,chrome-extension://flhmplnalnjjbmmjdcdehcoeiihnloja
      - key: ALLOW_EXTENSION_ORIGINS
        value: false
      # Render terminates TLS at one proxy in front of the app, so exactly one
      # X-Forwarded-For entry is trustworthy. Must match the real topology.
      - key: TRUSTED_PROXY_HOPS
        value: 1
      - key: SOCKET_PATH
        value: /api/socket.io
      - key: MORGAN_FORMAT
        value: tiny
