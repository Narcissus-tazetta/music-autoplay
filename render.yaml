# Render deployment configuration for music-autoplay.
# Deploy with: render services create -f render.yaml (or push to the repo with auto-deploy enabled).
#
# This file previously declared `services:` twice plus a mistyped `dservices:` block. YAML keeps
# only the last occurrence of a duplicate key, so the two earlier blocks were dead config that
# never reached Render. What remains below is exactly the block that was already in effect.
#
# Secrets marked `sync: false` must be filled in via the Render dashboard or CLI - never commit values here.

services:
  - type: web
    name: music-autoplay
    runtime: docker
    env: docker
    region: oregon
    plan: starter
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: YOUTUBE_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://music-auto-play.onrender.com
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        value: https://music-auto-play.onrender.com,chrome-extension://flhmplnalnjjbmmjdcdehcoeiihnloja
      - key: ALLOW_EXTENSION_ORIGINS
        value: false
      - key: SOCKET_PATH
        value: /api/socket.io
      - key: MORGAN_FORMAT
        value: tiny
      # NOTE: DATABASE_URL is wired up but PERSISTENCE_PROVIDER is unset, so the app still
      # defaults to the file store. Set PERSISTENCE_PROVIDER=pg to actually use this database.
      - key: DATABASE_URL
        fromDatabase:
          name: music-autoplay-db
          property: connectionString

databases:
  - name: music-autoplay-db
    databaseName: music_autoplay
    user: music_autoplay
